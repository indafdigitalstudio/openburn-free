[package]
name = "openburn-free"
version = "1.0.2"
description = "OpenBurn Free - perangkat lunak laser cutter/engraver open-source"
authors = ["OpenBurn contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "openburn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
